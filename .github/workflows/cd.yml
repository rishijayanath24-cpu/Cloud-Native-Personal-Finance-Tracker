name: CD - Deploy to Kubernetes

on:
  # Runs automatically after CI completes successfully on master
  workflow_run:
    workflows: ["CI - Build and Test"]
    types: [completed]
    branches: [master, main]

  # Can also be triggered manually
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    # Only run if CI passed (or manually triggered)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Apply namespace and config
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmaps/
          kubectl apply -f k8s/secrets/

      - name: Deploy services
        env:
          HUB: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG:  ${{ steps.tag.outputs.value }}
        run: |
          kubectl apply -f k8s/postgres/
          kubectl apply -f k8s/redis/
          kubectl apply -f k8s/deployments/
          kubectl apply -f k8s/ingress/

          # Update each deployment to the new image tag
          for svc in user-service transaction-service budget-service notification-service analytics-service api-gateway frontend; do
            kubectl set image deployment/${svc} ${svc}=${HUB}/finance-tracker-${svc}:${TAG} \
              -n finance-tracker || true
          done

      - name: Wait for rollout
        run: |
          for svc in user-service transaction-service budget-service notification-service analytics-service api-gateway frontend; do
            kubectl rollout status deployment/${svc} -n finance-tracker --timeout=180s || true
          done

      - name: Show pod status
        run: kubectl get pods -n finance-tracker

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed — rolling back..."
          for svc in user-service transaction-service budget-service notification-service analytics-service api-gateway frontend; do
            kubectl rollout undo deployment/${svc} -n finance-tracker || true
          done
