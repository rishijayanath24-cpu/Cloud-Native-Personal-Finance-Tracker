name: CI - Build and Test

on:
  push:
    branches: [master, main, develop, 'feature/**']
  pull_request:
    branches: [master, main]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ── Lint & Test Python services ─────────────────────────────────────────────
  lint-python:
    name: Lint Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, transaction-service, budget-service, notification-service, analytics-service]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: pip install -r requirements.txt flake8

      - name: Lint
        working-directory: services/${{ matrix.service }}
        run: flake8 app/ --max-line-length=120 --ignore=E501,W503
        continue-on-error: true

      - name: Run tests (if present)
        working-directory: services/${{ matrix.service }}
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key
          ALGORITHM: HS256
          REDIS_URL: redis://localhost:6379
          TRANSACTION_SERVICE_URL: http://localhost:8002
          BUDGET_SERVICE_URL: http://localhost:8003
        run: |
          if [ -d tests ]; then
            pip install pytest pytest-asyncio
            pytest tests/ -v --tb=short
          else
            echo "No tests for ${{ matrix.service }} — skipping"
          fi

  # ── Lint & Test Node.js (api-gateway) ───────────────────────────────────────
  lint-node:
    name: Lint Node.js (api-gateway)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: services/api-gateway
        run: npm install

      - name: Lint
        working-directory: services/api-gateway
        run: npm run lint || echo "No lint script — skipping"
        continue-on-error: true

  # ── Build frontend ───────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: services/frontend
        run: npm install

      - name: Build
        working-directory: services/frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: services/frontend/dist/
          retention-days: 1

  # ── Build & Push Docker images to Docker Hub ─────────────────────────────────
  build-images:
    name: Build & Push (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    needs: [lint-python, lint-node, build-frontend]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: user-service,          context: services/user-service }
          - { name: transaction-service,   context: services/transaction-service }
          - { name: budget-service,        context: services/budget-service }
          - { name: notification-service,  context: services/notification-service }
          - { name: analytics-service,     context: services/analytics-service }
          - { name: api-gateway,           context: services/api-gateway }
          - { name: frontend,              context: services/frontend }

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/finance-tracker-${{ matrix.service.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/finance-tracker-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
