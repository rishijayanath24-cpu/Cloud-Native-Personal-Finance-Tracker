apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: finance-tracker

resources:
  - namespace.yaml
  - configmaps/app-config.yaml
  - secrets/app-secrets.yaml
  - postgres/user-postgres.yaml
  - postgres/transaction-postgres.yaml
  - postgres/budget-postgres.yaml
  - redis/redis.yaml
  - deployments/user-service.yaml
  - deployments/transaction-service.yaml
  - deployments/budget-service.yaml
  - deployments/notification-service.yaml
  - deployments/api-gateway.yaml
  - deployments/frontend.yaml
  - ingress/ingress.yaml
  - monitoring/prometheus-config.yaml
  - monitoring/prometheus.yaml
  - monitoring/grafana.yaml
  - network-policies/network-policy.yaml

commonLabels:
  project: finance-tracker
  managed-by: kustomize
