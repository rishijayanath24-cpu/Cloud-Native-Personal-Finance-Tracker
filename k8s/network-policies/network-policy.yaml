apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: finance-tracker
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-gateway
  namespace: finance-tracker
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 3000
  egress:
    - podSelector:
        matchLabels:
          app: user-service
      ports:
        - port: 8001
    - podSelector:
        matchLabels:
          app: transaction-service
      ports:
        - port: 8002
    - podSelector:
        matchLabels:
          app: budget-service
      ports:
        - port: 8003
    - podSelector:
        matchLabels:
          app: notification-service
      ports:
        - port: 8004
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-microservices
  namespace: finance-tracker
spec:
  podSelector:
    matchLabels: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
  egress:
    - podSelector:
        matchLabels:
          app: redis
      ports:
        - port: 6379
    - ports:
        - port: 5432
    - ports:
        - port: 53
          protocol: UDP
